name: Update chinesecalendar

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chinesecalendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Get latest chinesecalendar version
        id: latest
        shell: bash
        run: |
          set -e

          LATEST_VERSION=$(curl -fsSL https://pypi.org/pypi/chinesecalendar/json | jq -r '.info.version')

          CURRENT_VERSION=$(grep -oE 'chinesecalendar==[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml \
            | head -1 \
            | cut -d= -f3)

          echo "Current version: $CURRENT_VERSION"
          echo "Latest version:  $LATEST_VERSION"

          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update chinesecalendar
        if: steps.latest.outputs.current != steps.latest.outputs.latest
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.latest.outputs.latest }}"

          sed -i "s/chinesecalendar==[0-9]\+\.[0-9]\+\.[0-9]\+/chinesecalendar==$VERSION/" pyproject.toml

          uv lock

          uv export \
            --format pylock.toml \
            --no-emit-project \
            -o pylock.toml

      - name: Commit and push update
        if: steps.latest.outputs.current != steps.latest.outputs.latest
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.latest.outputs.latest }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml pylock.toml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update chinesecalendar to $VERSION"
          git push
